host: 0.0.0.0
port: 8054
apiPathPrefix: "/api/*"
neo4j:
  host: "bolt://localhost:7687"
  user: "neo4j"
  password: "odobotdb"
openAI:
  secretKey: ""
  model: "gpt-5-mini-2025-08-07"
  temperature: null
  maxTokens: null
  getRelevantResourceParameters:
    maxAttempts: 5
    systemPrompt: |
      What follows is a list of resource types defined on a web application. Your job is to identify instances of these resources in the description of a task to completed on the web application. The output should be a list of 2-length arrays [resource name, value] in valid JSON and nothing else. If you cannot determine an appropriate value for a resource, set the value to null.
  getRelevantObjectParameters:
    maxAttempts: 5
    systemPrompt: |
      What follows is a list of objects that exist in a web application. Your job is to identify instances of these items in the description of a task to be completed on the web application. The output should be a list of 2-length arrays [input field, value] in valid JSON and nothing else. If you cannot determine an appropriate value for a field, set the value to null.
  getInputParameterMappings:
    maxAttempts: 5
    systemPrompt: |
      What follows is a list of objects and input values that exist in a web application. Your job is to identify instances of these items in the description of a task to be completed on the web application. The output should be a list of 2-length arrays [input field, value] in valid JSON and nothing else. If you cannot determine an appropriate value for a field, set the value to null. If there are multiple similar objects listed set the same input value for all of them.
  getTaskAPICalls:
    maxAttempts: 5
    systemPrompt: |
      What follows is a list of API routes that have been captured for a web application. You will also be given a description of a task to be completed on the web application. Your job is to identify one single API route, that best characterizes the intent of the task. The output should be a single number corresponding with the API route you have identified and nothing else.
  resolveDataEntryValue:
    maxAttempts: 5
    systemPrompt: |
      You are a web agent completing tasks on a web application. 
      You will be given a task description, as well as information about an input field, this information includes:
      * The html of the element into which data is to be entered. 
      * A snippet of HTML surrounding the input element. 
      * If available examples of any known previous data entered into this field.
      * An inferred semantic label for this field. 
      * An inferred semantic description for the kind of data that is to be entered in this field.
      
      Your output should be the task-appropriate text value to enter into the specified field and nothing else. 

  selectPath:
    maxAttempts: 5
    systemPrompt: |
      You are meant to complete the following task on a web application: 
      
      %s
      
      What follows is a list of possible paths to achieving the above task on the web application. Each path has an ID and a list of interactions to be applied to the web application. Your job is to select the ID of the path that best fits the description of the task above. These paths are constructed from data observed during past executions of similar tasks, therefore, sometimes button texts will include names of entities specific to those tasks. In those cases interpret the general meaning behind the button text rather than the literal text being displayed. The output should be the ID of the selected path an nothing else.