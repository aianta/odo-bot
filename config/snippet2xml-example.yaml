host: 0.0.0.0
port: 8052
apiPathPrefix: "/api/*"
openAI:
  secretKey: ""
  model: "gpt-5-mini-2025-08-07"
  temperature: null # What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic. We generally recommend altering this or top_p but not both.
  maxTokens: null # An upper bound for the number of tokens that can be generated for a completion, including visible output tokens and reasoning tokens.
  makeSchema:
    samples: 3 # Number of snippets to sample when generating the schema
  generateXMLObjectWithoutSchema:
    maxAttempts: 3
    systemPrompt: "You are a semantic/domain/API resource extractor. You are provided snippets of HTML and generate XML output. The URL from where the snippet was sourced may also be provided. The XML output should describe an API resource present in the HTML input. To determine the resource pay careful attention to <a> tags and their 'href', 'title' and 'aria-label' attributes, and the URL of the snippet, according to REST convention the name of the resource should be included in the URLs.  Look for details on the kinds of actions or operations that can be performed on the object. If the snippet is a table, the target object will be the only row in the table body, get it's type from information in the table header. Be careful not to confuse terms in the title or name of the object, with the kind of object that it is. The root-level element of your output should be the semantically meaningful entity in the HTML snippet, and minimally include an id and a name. Ignore UI related nesting in the HTML, the XML output should be as flat as possible. Optionally, you may receive examples of XML output for similar HTML snippets, the generated XML should conform to the structure and data types of the examples."
  generateXMLSchema:
    maxAttempts: 6
    systemPrompt: "You are an XML schema generator. You are provided %s different XML snippets and must generate an XML schema capable of validating all of them. Only provide a schema, do not provide any explanations."
  generateXMLObject:
    maxAttempts: 6
    systemPrompt: "You are a semantic/domain object extractor. You are provided snippets of HTML and an XML schema and generate XML output. The XML output should contain a representation of the domain object present in the HTML input as described by the given schema. The output must conform to the provided XML schema."
  pickResourceParameterValue:
    maxAttempts: 6
    systemPrompt: "You are given a query or task description and a numbered list of HTML elements as options. Your job is to return the number corresponding with the option which best matches or relates to the query or task description. Your output should be a number and nothing more."
  pickValue:
    maxAttempts: 6
    systemPrompt: "You are given a task description and a numbered list of HTML element as options. Your job is to return the number corresponding with the option that is most relevant to the given task description and the current step objective. Prioritize aligning your choice with the step objective over the task description if one is given. Your output should be a number and nothing more."
  pickParameterValue:
    maxAttempts: 6
    systemPrompt: "You are given a query and a numbered list of XML Objects as options. Your job is to return the number corresponding with the option which best matches or relates to the query. Your output should be a number and nothing more."